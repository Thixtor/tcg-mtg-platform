services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mtg_backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Sobreescribe cualquier valor previo y fija la conexión al Postgres local de Docker
      - DATABASE_URL=postgresql://admin:una_contrasena_segura_de_produccion@db:5432/mtg_market
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mtg_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true

  db:
    image: postgres:15-alpine
    container_name: mtg_db
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: una_contrasena_segura_de_produccion
      POSTGRES_DB: mtg_market
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d mtg_market"]
      interval: 3s
      timeout: 3s
      retries: 5

volumes:
  pgdata: