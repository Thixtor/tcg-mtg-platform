services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mtg_backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mtg_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true

  # Contenedor Postgres local (opcional / testing offline).
  # El backend consumirá directamente la DATABASE_URL declarada en tu .env.
  db:
    image: postgres:15-alpine
    container_name: mtg_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secretpassword}
      POSTGRES_DB: ${POSTGRES_DB:-mtg_market}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-mtg_market}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: