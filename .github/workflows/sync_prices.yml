name: Ingest Card Kingdom Prices (Daily Cron)

on:
  schedule:
    # Corre todos los días a las 09:00 UTC (04:00 AM hora Colombia)
    - cron: '0 9 * * *'
  # Permite ejecutarlo manualmente en cualquier momento desde la pestaña "Actions" de GitHub
  workflow_dispatch:

jobs:
  run-ingestion:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Card Kingdom Price Ingestion
        env:
          DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
          SECRET_KEY: "dummy-secret-key-for-github-actions-data-ingestion"
        run: |
          cd backend
          python -m app.scripts.ingest_prices